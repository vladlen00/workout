const IRENA_VERIFY_URL = "https://kjzxrpwqyyjcykwbqskn.supabase.co/functions/v1/verify-access";

const IRENA_TOKEN_EXPIRES_KEY = "irena_access_token_expires_at";

function irenaGetStoredToken() {
  try {
    const token = localStorage.getItem(IRENA_TOKEN_KEY);
    const expiresAt = parseInt(localStorage.getItem(IRENA_TOKEN_EXPIRES_KEY) || "0", 10);
    if (!token || !expiresAt) return null;
    if (Date.now() >= expiresAt - 60000) return null;
    return token;
  } catch { return null; }
}

function irenaStoreToken(token, ttl) {
  try {
    localStorage.setItem(IRENA_TOKEN_KEY, token);
    localStorage.setItem(IRENA_TOKEN_EXPIRES_KEY, String(Date.now() + ttl * 1000));
  } catch {}
}

function irenaGetInitData() {
  try {
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) {
      return window.Telegram.WebApp.initData;
    }
  } catch {}
  return null;
}

function irenaShowBlocked(reason) {
  document.body.innerHTML = '';

  document.body.appendChild(overlay);
}

async function irenaCheckAccess() {
  const cached = irenaGetStoredToken();
  if (cached) return true;
  const initData = irenaGetInitData();
  if (!initData) { irenaShowBlocked("no_telegram_context"); return false; }
  try {
    const res = await fetch(IRENA_VERIFY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData }),
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.ok && data.token) {
      irenaStoreToken(data.token, data.expiresIn || 86400);
      return true;
    }
    const reason = res.status === 403 ? "not_a_member" : res.status === 401 ? "invalid_init_data" : `error_${res.status}`;
    irenaShowBlocked(reason);
    return false;
  } catch {
    irenaShowBlocked("network_error");
    return false;

}

      "Content-Type": "application/json",
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      ...(options.headers || {}),
    },
  });
  return res.json().catch(() => null);
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', ['workouts','techniques'][i] === tab);
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
}

async function init() {
  // Кнопка-ссылка на оглавление подкастов в шапке (видна на обеих вкладках)
  document.getElementById('podcastIndexBtn').onclick = () => openTgLink(PODCAST_INDEX_URL);

  // Загружаем расписание открытия тренировок
  const schedule = await supabaseFetch('/rest/v1/workout_schedule?select=workout_id,unlocked_at');
  const unlockedIds = new Set((schedule || []).filter(r => r.unlocked_at).map(r => r.workout_id));

  // Рендерим тренировки
  const wList = document.getElementById('workoutList');
  WORKOUTS.forEach((v, idx) => {
    const unlocked = unlockedIds.has(v.id);
    const div = document.createElement('div');
    div.className = 'workout-item' + (unlocked ? '' : ' locked');
    div.innerHTML = `
      <div class="workout-num">${String(idx + 1).padStart(2, '0')}</div>
      <div class="workout-info">
        <div class="workout-name">${v.title}</div>
        ${!unlocked ? '<div class="unlock-soon">Скоро откроется</div>' : ''}
      </div>
      <div class="workout-play">${unlocked ? '▶' : '🔒'}</div>
    `;
    if (unlocked) div.onclick = () => openVideo(v);
    wList.appendChild(div);
  });

  // Рендерим техники — все доступны сразу
  const tList = document.getElementById('techniqueList');
  TECHNIQUES.forEach((v, idx) => {
    const div = document.createElement('div');
    div.className = 'workout-item';
    div.innerHTML = `
      <div class="workout-num">${String(idx + 1).padStart(2, '0')}</div>
      <div class="workout-info">
        <div class="workout-name">${v.title}</div>
      </div>
      <div class="workout-play">▶</div>
    `;
    div.onclick = () => openVideo(v);
    tList.appendChild(div);
  });

  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('listScreen').classList.add('active');
}

function openTgLink(url) {
  try { window.Telegram.WebApp.openTelegramLink(url); }
  catch { window.open(url, '_blank'); }
}

function openVideo(item) {
  document.getElementById('videoFrame').src = item.src;
  document.getElementById('playerTitle').textContent = item.title;

  // Кнопка подкаста: активная / "Подкаст скоро" / скрыта (у техник поля нет вообще)
  const btn = document.getElementById('playerPodcastBtn');
  const label = document.getElementById('playerPodcastLabel');
  if (item.podcastUrl) {
    btn.classList.remove('disabled');
    label.textContent = 'Слушать подкаст к тренировке';
    btn.onclick = () => openTgLink(item.podcastUrl);
    btn.style.display = '';
  } else if (item.podcastUrl === '') {
    btn.classList.add('disabled');
    label.textContent = 'Подкаст скоро';
    btn.onclick = null;
    btn.style.display = '';
  } else {
    btn.style.display = 'none';
    btn.onclick = null;
  }

  // Описание: первая строка — подзаголовок, остальное — body. По умолчанию свёрнуто.
  const desc = document.getElementById('playerDesc');
  if (item.description) {
    const lines = item.description.split('\n');
    const subhead = lines[0];
    const rest = lines.slice(1).join('\n').replace(/^\n+/, '');
    document.getElementById('playerDescSubhead').textContent = subhead;
    document.getElementById('playerDescText').textContent = rest;
    desc.open = false;
    desc.style.display = '';
  } else {
    desc.style.display = 'none';
  }

  document.getElementById('listScreen').classList.remove('active');
  document.getElementById('playerScreen').classList.add('active');
  window.scrollTo(0, 0);
}

function closeVideo() {
  document.getElementById('videoFrame').src = '';
  document.getElementById('playerPodcastBtn').onclick = null;
  document.getElementById('playerDesc').open = false;
  document.getElementById('playerScreen').classList.remove('active');
  document.getElementById('listScreen').classList.add('active');
}

irenaCheckAccess().then(ok => {
  if (!ok) return;
  init().catch(() => {
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('listScreen').classList.add('active');
  });
});
</script>
</body>
</html>
